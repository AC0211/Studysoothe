<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudySoothe</title> 
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#211935; --muted:#716C8C; --bg:#FAF8FF; --surface:#fff; --hair:#ECE7F7; --accent:#FF5D73; --soothe-sage: #A8BC9B; --soothe-gold: #E8C872;}
  *{box-sizing:border-box;}
  body{margin:0;   background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;display:flex; flex-direction:column;align-items: center; padding-top:2rem; min-height: 100vh;
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(168, 188, 155, 0.55) 0%, transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(124, 92, 252, 0.40) 0%, transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(232, 200, 114, 0.35) 0%, transparent 60%);
    background-attachment: fixed;}
  .wrap{max-width:720px; width:100%; padding:2rem;}
  .progress{font-size:0.8rem; color:var(--muted); font-weight:600; margin-bottom:0.6rem;}
  .progress span{color:var(--accent);}
  h1{font-family:'Space Grotesk',sans-serif; font-size:1.5rem; margin:0 0 2rem 0;}
  .card{background:var(--surface); border-radius:18px; padding:2rem 1.8rem; box-shadow:0 8px 28px rgba(33,25,53,0.07);}
  .value{font-family:'Space Grotesk',sans-serif; font-size:2.4rem; font-weight:700; color:var(--accent); text-align:center; margin-bottom:1rem;}
  input[type="text"] {
  width: 100%;
  padding: 0.9rem 1rem;
  font-size: 1rem;
  border: 2px solid var(--hair);
  border-radius: 12px;
  outline: none;
  margin-bottom: 1rem;
  background: var(--surface);
  color: var(--ink);
  }

  input[type="text"]:focus {
    border-color: var(--accent);
  }
  input[type=range]{-webkit-appearance:none; width:100%; height:8px; border-radius:6px; background:var(--hair); outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; border:5px solid var(--accent); cursor:pointer; box-shadow:0 2px 6px rgba(33,25,53,0.18);}
  input[type=range]::-moz-range-thumb{width:26px; height:26px; border-radius:50%; background:#fff; border:5px solid var(--accent); cursor:pointer;}
  .scale-labels{display:flex; justify-content:space-between; font-size:0.75rem; color:var(--muted); margin-top:0.5rem;}
  .name-label{font-size:0.8rem; color:var(--muted); font-weight:600; margin-bottom:0.6rem;display:block;}
  .welcome{width:100%; margin-top:1.8rem; padding:0.95rem; border:none; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer;}
  .welcome:hover{opacity:0.92;} 
  .Howdy-btn{width:100%; margin-top:1.8rem; padding:0.95rem; border:none; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer;}
  .Howdy-btn:hover{opacity:0.92;}
  .next-btn{width:100%; margin-top:1.8rem; padding:0.95rem; border:none; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer;}
  .next-btn:hover{opacity:0.92;}
</style>
</head>
<body>
  <div class="wrap">
  <div class="progress"></div>
  <h1>Welcome to StudySoothe!</h1>
  <h4 id = "welcome"></h4>
  <div class="card">
    <label for="name" class="name-label">Enter your name</label>
    <input type="text" class= "Name"id = "name" placeholder="Enter your name" autocomplete="off">
    <button class="Howdy-btn" id="Howdy" onclick="welcome()">Save</button>
    <button class="next-btn" id="nextBtn" disabled>Next</button>
  </div>
  </div>
  <script>
    function welcome(){
      let userName = document.getElementById("name").value.trim();
      if(userName===""){
        document.getElementById("welcome").innerText = "Please enter your name before continuing!"
        return
      }
      localStorage.setItem('studysoothe_name',userName);
      document.getElementById("welcome").innerText = "Welcome "+ userName +"! "+"We hope to produce accurate statistics to address what issues you are facing and how you can improve that! " + "We just require a few answers from you in order for us to provide the necessary information! Click the next button, " +userName + "!"
      document.getElementById("Howdy").disabled = true;
      document.getElementById("nextBtn").disabled = false
    }
  </script>
<script>
  const savedName = localStorage.getItem('studysoothe_name');

  // If they already registered their name before, skip index.html and send them straight to the Thankyou hub!
  const todayStr = new Date().toISOString().split('T')[0];
  const lastCompleted = localStorage.getItem('studysoothe_last_completed');

  if (savedName||lastCompleted === todayStr) {
    // User already checked in today — block them from re-entering inputs
    window.location.href = 'Thankyou.html'; 
  }
  // 🔧 SET THIS — the filename of the next page in your flow
  const NEXT_PAGE = 'step-1-stress.html';

  // Read whatever answers were already collected on earlier pages
  // (empty here, since this is step 1 — but the pattern is the same on every page)
  const params = new URLSearchParams(window.location.search); 

  // If the user came BACK to this page (e.g. clicked browser back), restore their answer


  document.getElementById('nextBtn').addEventListener('click', () => {
    params.set('name', localStorage.getItem('studysoothe_name'));
    window.location.href = NEXT_PAGE + '?' + params.toString();  // carry everything to the next page
  });
</script>
</body>
</html>
