<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connections </title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#FAF8FF; --surface:#fff; --ink:#211935; --muted:#716C8C; --hair:#ECE7F7;
  --stress:#FF5D73; --stress-bg:#FFE6EA; --caffeine:#FFA726; --caffeine-bg:#FFF1DC;
  --sleep:#4C7CF0; --sleep-bg:#E7EDFE; --study:#1FBF9F; --study-bg:#DEF7F1;
  --brand:#7C5CFC; --brand-bg:#F1ECFF; --brand-dark:#5C3DE0;
  --accent:#7C5CFC; /* <-- Added this */
  }
  *{box-sizing:border-box;}
  body{margin:0;   background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;display:flex; flex-direction:column;align-items: center; padding-top:2rem; min-height: 100vh;
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 15% 15%, rgba(168, 188, 155, 0.55) 0%, transparent 55%),
      radial-gradient(circle at 85% 85%, rgba(124, 92, 252, 0.40) 0%, transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(232, 200, 114, 0.35) 0%, transparent 60%);
    background-attachment: fixed;}
  .wrap{max-width:720px; width:100%; padding:2rem;}
  .progress{font-size:0.8rem; color:var(--muted); font-weight:600; margin-bottom:0.6rem;}
  .progress span{color:var(--accent);}
  h1{font-family:'Space Grotesk',sans-serif; font-size:1.5rem; margin:0 0 2rem 0;}
  .card{background:var(--surface); border-radius:18px; padding:2rem 1.8rem; box-shadow:0 8px 28px rgba(33,25,53,0.07);}
  .value{font-family:'Space Grotesk',sans-serif; font-size:2.4rem; font-weight:700; color:var(--accent); text-align:center; margin-bottom:1rem;}
  input[type=range]{-webkit-appearance:none; width:100%; height:8px; border-radius:6px; background:var(--hair); outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; border:5px solid var(--accent); cursor:pointer; box-shadow:0 2px 6px rgba(33,25,53,0.18);}
  input[type=range]::-moz-range-thumb{width:26px; height:26px; border-radius:50%; background:#fff; border:5px solid var(--accent); cursor:pointer;}
  .scale-labels{display:flex; justify-content:space-between; font-size:0.75rem; color:var(--muted); margin-top:0.5rem;}
  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:0.8rem; margin-bottom:1.1rem;}
  .stat{border-radius:14px; padding:1rem;}
  .stat.stress{background:var(--stress-bg);} .stat.caffeine{background:var(--caffeine-bg);}
  .stat.sleep{background:var(--sleep-bg);} .stat.study{background:var(--study-bg);}
  .stat .num{font-family:'Space Grotesk',sans-serif; font-size:1.5rem; font-weight:700; display:block;}
  .stat.stress .num{color:var(--stress);} .stat.caffeine .num{color:var(--caffeine);}
  .stat.sleep .num{color:var(--sleep);} .stat.study .num{color:var(--study);}
  .stat .lbl{font-size:0.76rem; color:var(--muted); font-weight:600;}
  .connection{display:flex; gap:0.8rem; align-items:flex-start; padding:0.9rem 0; border-bottom:1px solid var(--hair);}
  .connection:last-child{border-bottom:none;}
  .connection .dot{width:8px; height:8px; border-radius:50%; margin-top:6px; flex-shrink:0;}
  .connection p{margin:0; font-size:0.92rem; line-height:1.5;}
  .connection .sub{color:var(--muted); font-size:0.8rem; margin-top:2px;}
  .previous-btn{width:100%; margin-top:1.8rem; padding:0.95rem; border:none; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer;}
  .previous-btn:hover{opacity:0.92;}
  .next-btn{width:100%; margin-top:1.8rem; padding:0.95rem; border:none; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer;}
  .next-btn:hover{opacity:0.92;}
</style>
</head>
<body>
<div class="card">
  <h2>Connections</h2>
  <p class="hint">Patterns compared against your own personal averages — not general advice.</p>
  <div id="connectionsBox"></div>
  <button class="previous-btn" id="previousBtn">Previous</button>
  <button class="next-btn" id="nextBtn">Next</button>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const PREVIOUS_PAGE = 'Stats.html';
const NEXT_PAGE = 'ai_coach.html';
const INDEX_KEY = 'studysoothe-index';
let entries = {}
function avg(arr, field){
  const vals = arr.map(x=>x[field]).filter(v=>v!==null && v!==undefined);
  if(vals.length===0) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function fmt(n, suffix){ return n===null ? '—' : (Math.round(n*10)/10) + (suffix||''); }
async function getIndex(){
  try{
    const r = localStorage.getItem(INDEX_KEY);
    if(r) return JSON.parse(r);
    return [];
  }catch(e){
    // key doesn't exist yet (first ever run) — that's expected, not a real error
    return [];
  }
}
async function loadAllEntries(){
  const loaded = {};
  try{
    const dateKeys = await getIndex();
    for(const dk of dateKeys){
      try{
        const r = localStorage.getItem('entry:'+dk);
        if(r) loaded[dk] = JSON.parse(r);
      }catch(e){ /* that entry is missing/unreadable — skip it */ }
    }
  }catch(e){
    console.error('Could not load entries', e);
  }
  entries = loaded;
}
function renderConnections(){
  const box = document.getElementById('connectionsBox');
  const all = Object.keys(entries).map(k=>({date:k, ...entries[k]}));
  if(all.length < 3){
    box.innerHTML = `<div class="empty">Log at least 3 days to start seeing patterns. You have ${all.length} so far.</div>`;
    return;
  }
  const aStress = avg(all,'stress'), aSleep = avg(all,'sleep'), aCaff = avg(all,'caffeine'), aStudy = avg(all,'study');
  const lines = [];

  // Direct high-stress days evaluation
  const highStressDays = all.filter(e => e.stress > aStress);

  if (highStressDays.length > 0) {
    // Check Sleep
    const lowSleepCount = highStressDays.filter(e => e.sleep < aSleep).length;
    if (lowSleepCount > 0) {
      lines.push({
        color: 'var(--sleep)',
        text: `Stress was above your average on ${lowSleepCount} of the ${highStressDays.length} days you had below-average sleep.`,
        sub: `Personal average stress: ${fmt(aStress)}/10`
      });
    }

    // Check Caffeine
    const highCaffCount = highStressDays.filter(e => e.caffeine > aCaff).length;
    if (highCaffCount > 0) {
      lines.push({
        color: 'var(--caffeine)',
        text: `Stress was above your average on ${highCaffCount} of the ${highStressDays.length} days you had above-average caffeine.`,
        sub: `Personal average stress: ${fmt(aStress)}/10`
      });
    }

    // Check Study
    const highStudyCount = highStressDays.filter(e => e.study > aStudy).length;
    if (highStudyCount > 0) {
      lines.push({
        color: 'var(--study)',
        text: `Stress was above your average on ${highStudyCount} of the ${highStressDays.length} days you had above-average study hours.`,
        sub: `Personal average stress: ${fmt(aStress)}/10`
      });
    }
  }

  if(lines.length===0){
    box.innerHTML = `<div class="empty">No strong single-factor pattern yet — your stress looks fairly steady across your logged days. Keep logging to sharpen this.</div>`;
    return;
  }
  box.innerHTML = lines.map(l=>`
    <div class="connection">
      <div class="dot" style="background:${l.color}"></div>
      <div><p>${l.text}</p><div class="sub">${l.sub}</div></div>
    </div>
  `).join('');
}
document.getElementById('nextBtn').addEventListener('click', () => {
  window.location.href = NEXT_PAGE + '?' + params.toString();
});

document.getElementById('previousBtn').addEventListener('click', () => {
  window.location.href = PREVIOUS_PAGE + '?' + params.toString();
});
function todayKey(){
  return formatLocalDate(new Date());
}
function formatLocalDate(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateLabel(key){
  const d = new Date(key+'T00:00:00');
  return d.toLocaleDateString(undefined,{month:'short', day:'numeric'});
}
(async function init(){
  if (params.has('stress')) {
    const keyToday = todayKey()
    const todayData = {
      stress: Number(params.get('stress')) || 5,
      sleep: Number(params.get('sleep')) || 0,
      caffeine: Number(params.get('caffeine')) || 0,
      study: Number(params.get('study')) || 0
    };
    try {
      localStorage.setItem('entry:' + keyToday, JSON.stringify(todayData));
      let idx = [];
      const r = localStorage.getItem(INDEX_KEY);
      if (r) idx = JSON.parse(r);
      if (!idx.includes(keyToday)) {
        idx.push(keyToday);
        localStorage.setItem(INDEX_KEY, JSON.stringify(idx));
      }
    } catch(e) {}
  }
  await loadAllEntries();
  renderConnections();
})();
</script>
</body>
</html>
