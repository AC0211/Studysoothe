<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check-in — Caffeine</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#211935; --muted:#716C8C; --bg:#FAF8FF; --surface:#fff; --hair:#ECE7F7; --accent:#FFA726; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;}
  .wrap{max-width:420px; width:100%; padding:2rem;}
  .progress{font-size:0.8rem; color:var(--muted); font-weight:600; margin-bottom:0.6rem;}
  .progress span{color:var(--accent);}
  h1{font-family:'Space Grotesk',sans-serif; font-size:1.5rem; margin:0 0 2rem 0;}
  .card{background:var(--surface); border-radius:18px; padding:2rem 1.8rem; box-shadow:0 8px 28px rgba(33,25,53,0.07); text-align:center;}
  .value{font-family:'Space Grotesk',sans-serif; font-size:2.4rem; font-weight:700; color:var(--accent); margin-bottom:1rem;}
  .stepper{display:flex; align-items:center; justify-content:center; gap:1rem;}
  .stepper button{width:44px; height:44px; border-radius:12px; border:1px solid var(--hair); background:#fff; font-size:1.4rem; color:var(--accent); cursor:pointer;}
  .stepper button:hover{background:#FFF1DC;}
  .cup-row{display:flex; gap:6px;}
  .cup{width:20px; height:24px; border-radius:4px 4px 8px 8px; background:var(--hair);}
  .cup.filled{background:var(--accent);}
  .previous-btn{width:100%; margin-top:1.8rem; padding:0.95rem; border:none; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer;}
  .previous-btn:hover{opacity:0.92;}
  .next-btn{width:100%; margin-top:1.8rem; padding:0.95rem; border:none; border-radius:14px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer;}
  .next-btn:hover{opacity:0.92;}
</style>
</head>
<body>
<div class="wrap">
  <div class="progress"><span>Step 4</span> of 4</div>
  <h1>How many caffeinated drinks have you had today?</h1>
  <div class="card">
    <div class="value" id="val">0</div>
    <div class="stepper">
      <button id="minusBtn">−</button>
      <div class="cup-row" id="cupRow"></div>
      <button id="plusBtn">+</button>
    </div>
    <button class="previous-btn" id="previousBtn">Previous</button>
    <button class="next-btn" id="nextBtn">Next</button>
  </div>
</div>

<script>
  const todayStr = new Date().toISOString().split('T')[0];
  const lastCompleted = localStorage.getItem('studysoothe_last_completed');

  if (lastCompleted === todayStr) {
    window.location.href = 'Thankyou.html'; 
  }
  // 🔧 SET THIS — the filename of the next page in your flow
  const PREVIOUS_PAGE = 'step-3-study.html';
  const NEXT_PAGE = 'step-5-review.html';

  const params = new URLSearchParams(window.location.search);
  // (params.get('stress') is already sitting in here from step 1 — this page
  // doesn't need to read it, just carry it forward when we navigate onward)

  let count = params.has('caffeine') ? Number(params.get('caffeine')) : 0;
  const valueLabel = document.getElementById('val');
  const cupRow = document.getElementById('cupRow');

  function renderCups(){
    cupRow.innerHTML = '';
    const slots = Math.max(6, count);
    for(let i=0;i<slots;i++){
      const c = document.createElement('div');
      c.className = 'cup' + (i < count ? ' filled' : '');
      cupRow.appendChild(c);
    }
  }
  function update(){ valueLabel.textContent = count; renderCups(); }
  update();

  document.getElementById('plusBtn').addEventListener('click', () => { count++; update(); });
  document.getElementById('minusBtn').addEventListener('click', () => { count = Math.max(0, count-1); update(); });

  document.getElementById('nextBtn').addEventListener('click', () => {
    params.set('caffeine', count);
    window.location.href = NEXT_PAGE + '?' + params.toString();
  });
  document.getElementById('previousBtn').addEventListener('click', () => {
    params.set('caffeine', count);          // record this page's answer
    window.location.href = PREVIOUS_PAGE + '?' + params.toString();  // carry everything to the next page
  });
</script>
</body>
</html>
